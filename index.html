<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew Abboushi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
 
  :root {
    --white: #F7F4EF;
    --black: #0D0D0D;
    --burgundy: #6B1E2E;
    --burgundy-light: #8B2A3E;
    --stone: #C8BFB0;
    --ink: #1A1A1A;
    --mist: #E8E3DC;
  }
 
  html, body {
    height: 100%;
    width: 100%;
  }
 
  body {
    background-color: var(--white);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
    cursor: none;
  }
 
  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 6px;
    height: 6px;
    background: var(--burgundy);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease;
  }
 
  .cursor-ring {
    position: fixed;
    width: 28px;
    height: 28px;
    border: 1px solid var(--burgundy);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: all 0.18s ease;
    opacity: 0.5;
  }
 
  /* Japanese mon circle — decorative background element */
  .mon {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    height: 520px;
    border: 1px solid var(--stone);
    border-radius: 50%;
    opacity: 0;
    animation: fadeIn 2.4s ease 0.4s forwards;
  }
 
  .mon::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
    border: 1px solid var(--mist);
    border-radius: 50%;
  }
 
  /* Thin horizontal rule — British editorial */
  .rule-top {
    position: fixed;
    top: 48px;
    left: 48px;
    right: 48px;
    height: 1px;
    background: var(--stone);
    opacity: 0;
    animation: fadeIn 1.2s ease 0.2s forwards;
  }
 
  .rule-bottom {
    position: fixed;
    bottom: 48px;
    left: 48px;
    right: 48px;
    height: 1px;
    background: var(--stone);
    opacity: 0;
    animation: fadeIn 1.2s ease 0.2s forwards;
  }
 
  /* Corner marks */
  .corner {
    position: fixed;
    width: 16px;
    height: 16px;
    opacity: 0;
    animation: fadeIn 1.4s ease 0.3s forwards;
  }
 
  .corner-tl { top: 40px; left: 40px; border-top: 1px solid var(--burgundy); border-left: 1px solid var(--burgundy); }
  .corner-tr { top: 40px; right: 40px; border-top: 1px solid var(--burgundy); border-right: 1px solid var(--burgundy); }
  .corner-bl { bottom: 40px; left: 40px; border-bottom: 1px solid var(--burgundy); border-left: 1px solid var(--burgundy); }
  .corner-br { bottom: 40px; right: 40px; border-bottom: 1px solid var(--burgundy); border-right: 1px solid var(--burgundy); }
 
  /* Main content */
  .container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
  }
 
  /* Japanese characters — vertical, left side */
  .kanji {
    position: fixed;
    left: 52px;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-family: 'Shippori Mincho', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--stone);
    opacity: 0;
    animation: fadeIn 2s ease 1.2s forwards;
  }
 
  /* Year marker — right side */
  .year-marker {
    position: fixed;
    right: 52px;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.4em;
    color: var(--stone);
    opacity: 0;
    animation: fadeIn 2s ease 1.4s forwards;
  }
 
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(36px, 5vw, 58px);
    letter-spacing: 0.22em;
    color: var(--ink);
    text-transform: uppercase;
    opacity: 0;
    animation: riseIn 1.6s ease 0.6s forwards;
    margin-bottom: 6px;
  }
 
  .name-kanji {
    font-family: 'Shippori Mincho', serif;
    font-size: 13px;
    letter-spacing: 0.5em;
    color: var(--stone);
    opacity: 0;
    animation: riseIn 1.6s ease 0.9s forwards;
    margin-bottom: 28px;
    display: block;
  }
 
  .divider {
    width: 40px;
    height: 1px;
    background: var(--burgundy);
    margin: 0 auto 28px;
    opacity: 0;
    animation: expandIn 1s ease 1.2s forwards;
  }
 
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: 0.15em;
    color: #666;
    opacity: 0;
    animation: riseIn 1.6s ease 1.4s forwards;
    margin-bottom: 48px;
  }
 
  .status {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--burgundy);
    border: 1px solid var(--burgundy);
    padding: 8px 20px;
    opacity: 0;
    animation: riseIn 1.6s ease 1.8s forwards;
  }
 
  /* Bottom location line */
  .location {
    position: fixed;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--stone);
    opacity: 0;
    animation: fadeIn 2s ease 2.2s forwards;
    white-space: nowrap;
  }
 
  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
 
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
 
  @keyframes expandIn {
    from { opacity: 0; width: 0; }
    to { opacity: 1; width: 40px; }
  }
</style>
</head>
<body>
 
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
 
<div class="rule-top"></div>
<div class="rule-bottom"></div>
 
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>
 
<div class="mon"></div>
 
<div class="kanji">思想家　・　音楽家　・　分析家</div>
<div class="year-marker">MMXXVI</div>
 
<div class="container">
  <span class="name">Andrew Abboushi</span>
  <span class="name-kanji">ア ン ド リ ュ ー ・ ア ボ ウ シ</span>
  <div class="divider"></div>
  <p class="tagline">Musician &nbsp;·&nbsp; Analyist &nbsp;·&nbsp; Technologist</p>
  <span class="status">Coming Soon</span>
</div>
 
<div class="location">United States of America &nbsp;·&nbsp; 2026</div>
 
<script>
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mouseX = 0, mouseY = 0;
  let ringX = 0, ringY = 0;
 
  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';
  });
 
  function animateRing() {
    ringX += (mouseX - ringX) * 0.12;
    ringY += (mouseY - ringY) * 0.12;
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
    requestAnimationFrame(animateRing);
  }
  animateRing();
</script>
 
</body>
</html>
